    </span>
    <span class="brand-text"><strong>Psychology</strong><span>心理学系统学习平台</span></span>
  </a>
  <div class="topbar-actions">
    <button class="icon-btn" id="searchBtnTop" aria-label="搜索课程" title="搜索">

<!-- 阅读进度条 -->
<div class="progress-rail" id="progressRail"><div class="progress-fill" id="progressFill"></div></div>

<!-- 主视图容器 -->
<main id="app" tabindex="-1"></main>

<!-- 侧边目录抽屉 -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-label="课程目录">
  <div class="drawer-head">
    <div class="drawer-title">课程目录</div>
    <button class="icon-btn" id="drawerClose" aria-label="关闭目录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.2 4.2" stroke-linecap="round"/></svg>
    <input type="search" id="drawerNavFilter" placeholder="筛选模块 / 章节…" autocomplete="off">
  </div>
  <nav class="drawer-nav" id="drawerNav"></nav>
</aside>

<!-- 全站搜索面板 -->
<div class="search-overlay" id="searchOverlay" aria-hidden="true">
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="全站搜索">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.2 4.2" stroke-linecap="round"/></svg>
      <input type="search" id="searchInput" placeholder="搜索课程内容、概念、学者、实验…" autocomplete="off">
      <button class="search-close" id="searchClose" aria-label="关闭搜索">ESC</button>
    </div>
    <div class="search-meta" id="searchMeta">输入关键词开始检索</div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<!-- 回到顶部 -->
<button class="to-top" id="toTop" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 14 6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 数据文件 -->
<script src="data/meta.js"></script>
<script src="data/content.js"></script>
<script src="assets/js/app.js"></script>

</html>
